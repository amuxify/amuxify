<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og.png. Render: rsvg-convert -w 1200 -h 630 og.svg -o og.png -->
  <defs>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="logomask">
      <rect x="40" y="75" width="480" height="480" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="#000"/>
  <image xlink:href="amuxify-logo.png" x="40" y="75" width="480" height="480" mask="url(#logomask)"/>
  <g font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#e6edf3">
    <text x="540" y="258" font-size="96" font-weight="700" letter-spacing="-3">amuxify</text>
    <text x="544" y="318" font-size="34" fill="#9fb3c8">The ingest gate for self-hosted media.</text>
    <text x="544" y="382" font-size="34" font-weight="600" fill="#6cb2eb">Verify. Sanitize. Normalize. Prove.</text>
    <text x="544" y="456" font-size="24" fill="#9fb3c8">Clean MKV for Plex and Jellyfin. Exit codes for</text>
    <text x="544" y="490" font-size="24" fill="#9fb3c8">SABnzbd, NZBGet, Sonarr and Radarr.</text>
    <text x="544" y="562" font-size="22" font-weight="600" fill="#6cb2eb">amuxify.com</text>
  </g>
  <!-- open source badge, top right -->
  <g transform="translate(798 40)">
    <rect x="0" y="0" width="362" height="52" rx="26" fill="#0b1420" stroke="#2f6f9f" stroke-width="2"/>
    <!-- keyhole glyph -->
    <circle cx="30" cy="26" r="13" fill="none" stroke="#6cb2eb" stroke-width="4"/>
    <circle cx="30" cy="22" r="3.5" fill="#6cb2eb"/>
    <path d="M27.5 24 L25 33 L35 33 L32.5 24 Z" fill="#6cb2eb"/>
    <text x="56" y="34" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Open source <tspan fill="#6cb2eb">·</tspan> BSD-3-Clause</text>
  </g>
</svg>
