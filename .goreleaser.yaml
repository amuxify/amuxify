version: 2
project_name: amuxify
before:
  hooks:
    - go mod tidy
builds:
  - id: amuxify
    main: ./cmd/amuxify
    binary: amuxify
    env: [CGO_ENABLED=0]
    # No Windows build: the safety guarantees rest on POSIX file identity
    # (internal/fsutil reads syscall.Stat_t), and Windows users run the
    # Docker image or the Linux binary under WSL; see docs/install.md.
    goos: [linux, darwin]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - { goos: darwin, goarch: arm }
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/amuxify/amuxify/internal/cli.Version={{.Version}}
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files: [LICENSE, README.md, CHANGELOG.md, docs/*, contrib/hooks/*]
checksum:
  name_template: checksums.txt
  algorithm: sha256
changelog:
  use: github
  sort: asc
release:
  draft: true
  prerelease: auto

# Homebrew tap (macOS). goreleaser pushes Casks/amuxify.rb to
# github.com/amuxify/homebrew-tap on every tag. Needs the HOMEBREW_TAP_TOKEN
# secret (contents: write on that repository). When the secret is absent the
# cask is only written to dist/ and the release still succeeds.
homebrew_casks:
  - name: amuxify
    repository:
      owner: amuxify
      name: homebrew-tap
      branch: main
      # goreleaser requires this field to be exactly one {{ .Env.NAME }}.
      # It is only read when skip_upload is not "true" (see below).
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://amuxify.com
    description: The ingest gate for self-hosted media
    dependencies:
      - formula: ffmpeg
      - formula: mkvtoolnix
    # Release binaries are not notarized; clear the quarantine flag so the
    # first run is not blocked by Gatekeeper.
    #
    # goreleaser renders hooks.post.install as a raw `postflight do` block,
    # which Homebrew 7 reports as deprecated in favour of `postflight_steps`
    # (goreleaser issue #6870; PR #6873 adds hooks.post.install_steps and is
    # unreleased as of v2.18.2). Until that ships, custom_block places the
    # steps stanza in the cask verbatim. Homebrew loads it without a warning;
    # only its StanzaOrder style cop notes that it precedes `version`, which
    # `brew style` reports and nothing enforces. Move this back to
    # hooks.post.install_steps once goreleaser supports it.
    #
    # goreleaser runs the whole rendered cask through its Go template engine
    # once, so Homebrew's own {{staged_path}} token is written as a quoted
    # Go template literal; the engine turns it back into {{staged_path}}.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/amuxify"]
        end
      end
    # auto: skip for pre-release tags (v1.0.0-rc1); true: token not configured.
    # Evaluated before the token, so an unset secret never fails the release.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
