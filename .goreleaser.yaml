version: 2
project_name: amuxify
before:
  hooks:
    - go mod tidy
builds:
  - id: amuxify
    main: ./cmd/amuxify
    binary: amuxify
    env: [CGO_ENABLED=0]
    # Windows is a 0.4 item; internal/fsutil uses syscall.Stat_t and does
    # not build there yet.
    goos: [linux, darwin]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - { goos: darwin, goarch: arm }
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/amuxify/amuxify/internal/cli.Version={{.Version}}
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files: [LICENSE, README.md, CHANGELOG.md, docs/*]
checksum:
  name_template: checksums.txt
  algorithm: sha256
changelog:
  use: github
  sort: asc
release:
  draft: true
  prerelease: auto

# Homebrew tap (macOS). goreleaser pushes Casks/amuxify.rb to
# github.com/amuxify/homebrew-tap on every tag. Needs the HOMEBREW_TAP_TOKEN
# secret (contents: write on that repository). When the secret is absent the
# cask is only written to dist/ and the release still succeeds.
homebrew_casks:
  - name: amuxify
    repository:
      owner: amuxify
      name: homebrew-tap
      branch: main
      token: '{{ index .Env "HOMEBREW_TAP_TOKEN" }}'
    directory: Casks
    homepage: https://amuxify.com
    description: The ingest gate for self-hosted media
    dependencies:
      - formula: ffmpeg
      - formula: mkvtoolnix
    # Release binaries are not notarized; clear the quarantine flag so the
    # first run is not blocked by Gatekeeper.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/amuxify"]
          end
    # auto: skip for pre-release tags (v1.0.0-rc1); true: token not configured.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
